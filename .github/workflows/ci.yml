name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  foundation-and-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache locked gems
        uses: actions/cache@v4
        with:
          path: .bundle/gems
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '.ruby-version') }}
      - name: Prepare the baseline databases
        run: script/setup-dev
      - name: Run API, model and seed tests
        run: RAILS_ENV=test bin/lab run --rm web bin/rails test
      - name: Check Ruby style and autoloading
        run: bin/lab run --rm --no-deps web bash -c 'bin/rubocop && bin/rails zeitwerk:check'
      - name: Check application security
        run: bin/lab run --rm --no-deps web bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - name: PgBouncer protocol and API smoke test
        run: K6_VUS=6 K6_DURATION=3s script/experiment-next pooled results/ci-pooled
      - name: Redis transport and cache correctness smoke test
        run: |
          bin/lab run --rm web bin/rails lab:advanced:prepare
          bin/lab --profile cache up -d --wait redis
          LAB_EXPERIMENT_ENDPOINTS=1 RAILS_ENV=benchmark bin/lab up -d --force-recreate --wait web
          bin/lab exec -T web bin/rails runner script/check-advanced.rb cache /app/results/ci-cache
      - name: Stop services
        if: always()
        run: bin/lab --profile '*' down
