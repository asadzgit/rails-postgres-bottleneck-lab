[databases]
rails_postgres_bottleneck_lab_development = host=db port=5432 dbname=rails_postgres_bottleneck_lab_development

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
pidfile = /tmp/pgbouncer.pid
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = rails
stats_users = rails
pool_mode = transaction
# Deliberately exercise the portable no-server-prepared-statements configuration.
max_prepared_statements = 0
max_client_conn = 200
default_pool_size = POOL_SIZE
max_db_connections = POOL_SIZE
reserve_pool_size = 0
query_wait_timeout = 10
server_connect_timeout = 5
ignore_startup_parameters = extra_float_digits
